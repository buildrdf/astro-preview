<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171A33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Astro App</title>
<link rel="stylesheet" href="styles.css?v=20260901g">
</head>
<body>

<div class="wash"></div>

<script>
/* Device-side error trap. Errors are always collected; adding #debug to the
   URL paints them on screen - so an iPhone-only failure can be read without
   a connected inspector. */
window.__errs=[];
addEventListener("error",e=>{
  const m=(e.error&&e.error.stack||e.message||"error").split("\n").slice(0,3).join(" | ");
  window.__errs.push(m);
  if(location.hash.includes("debug")){
    let n=document.getElementById("errband");
    if(!n){n=document.createElement("div");n.id="errband";
      n.style.cssText="position:fixed;left:0;right:0;bottom:0;z-index:9999;"+
      "background:#7f1d1d;color:#fff;font:11px/1.5 -apple-system,monospace;"+
      "padding:8px 12px;max-height:40vh;overflow:auto;white-space:pre-wrap";
      document.body.appendChild(n)}
    n.textContent=window.__errs.join("\n\n");
  }
},true);
</script>
<div class="app">
  <header class="topbar" id="topbar">
      <button class="tb-back" id="tbback" aria-label="Back">&#8249;</button>
      <span class="tb-title" id="tbtitle"><b>Today</b></span>
      <div class="tb-centre" id="tbcentre"></div>
      <div class="tb-actions" id="tbact"></div>
      <button class="closebtn" id="close" aria-label="Close">&#10005;</button>
    </header>
    <div class="pages">
    <section class="page on" id="pg-today"></section>
    <section class="page" id="pg-timeline"></section>
    <section class="page" id="pg-universe"></section>
    <section class="page" id="pg-guide"></section>
    <section class="page" id="pg-you"></section>
  </div>
</div>

<section class="sheet" id="sheet" aria-live="polite">
  <div class="sheetgap"></div>
  <div class="sheetcard"><div id="sheetbody"></div></div>
</section>
<div class="calsheet" id="calsheet" role="dialog" aria-label="Choose a date"></div>

<nav class="tabs" id="tabs" role="tablist"></nav>

<script type="module" src="src/app.js?v=20260901g"></script>
</body>
</html>
