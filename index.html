<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#070C1E">
<title>Astro App</title>
<style>
:root{
  --void:#070C1E; --void-2:#0B1330; --raise:#111A38;
  --line:#222E52; --line-2:#35456F; --hot:#7389B8;
  --ink:#EFF1F7; --ink-2:#9BA5BE; --ink-3:#6B7590;
  --brass:#C29B4E;
  --sun:#F0A93B; --moon:#CFD8E8; --mars:#D0533F; --mercury:#5FBFA0;
  --jupiter:#E0C067; --venus:#E7C6D0; --saturn:#7E90C4;
  --rahu:#8B6BA8; --ketu:#967C68;
  --ff:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  --fm:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
  --ease:cubic-bezier(.22,1,.36,1);
  --tabh:70px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--void);color:var(--ink);font-family:var(--ff);
  -webkit-font-smoothing:antialiased;overflow:hidden;
  height:100dvh;position:relative;
}
#sky{position:fixed;inset:0;z-index:0}
.wash{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(115% 78% at 50% 22%, rgba(38,60,132,.30) 0%, rgba(12,20,52,.34) 44%, rgba(4,7,20,.9) 100%)}

/* -- scaffold ---------------------------------------------------- */
.app{position:relative;z-index:2;height:100dvh;display:flex;flex-direction:column}
.pages{flex:1 1 auto;position:relative;min-height:0}
.page{
  position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  padding:max(12px,env(safe-area-inset-top)) 20px calc(var(--tabh) + 26px);
  opacity:0;pointer-events:none;transform:translateY(8px);
  transition:opacity .34s var(--ease), transform .34s var(--ease);
}
.page.on{opacity:1;pointer-events:auto;transform:none}
.page::-webkit-scrollbar{display:none}

/* -- tab bar ----------------------------------------------------- */
.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  height:calc(var(--tabh) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  display:grid;grid-template-columns:repeat(4,1fr);
  background:rgba(11,19,48,.72);
  -webkit-backdrop-filter:saturate(180%) blur(26px);
  backdrop-filter:saturate(180%) blur(26px);
  border-top:.5px solid rgba(120,145,205,.20);
}
.tab{
  border:0;background:none;cursor:pointer;color:var(--ink-3);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  font-family:var(--ff);font-size:10px;letter-spacing:.01em;font-weight:520;
  transition:color .26s var(--ease);padding:0;
}
.tab svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;transition:transform .4s var(--ease)}
.tab.on{color:var(--ink)}
.tab.on svg{transform:translateY(-1px) scale(1.06)}
.tab:focus-visible{outline:2px solid var(--hot);outline-offset:-4px;border-radius:10px}

/* -- shared type ------------------------------------------------- */
h1{font-size:30px;font-weight:680;letter-spacing:-.03em;margin:0 0 2px;text-wrap:balance}
h2{font-size:17px;font-weight:640;letter-spacing:-.015em;margin:0 0 10px}
.eyebrow{font-family:var(--fm);font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
.muted{color:var(--ink-2);font-size:14.5px;line-height:1.55;margin:0}
.section{margin:30px 0 0}

.card{
  background:linear-gradient(168deg, rgba(30,44,88,.42), rgba(14,22,50,.34));
  border:.5px solid rgba(110,135,195,.18);
  border-radius:17px;padding:17px 18px;
}
.grid{display:flex;flex-direction:column;gap:11px}

/* -- today ------------------------------------------------------- */

.tophead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.tophead-actions{display:flex;align-items:center;gap:8px;padding-top:4px}
.calbtn{width:36px;height:36px;border-radius:11px;cursor:pointer;display:grid;place-items:center;
  background:rgba(255,255,255,.05);border:.5px solid rgba(110,135,195,.22);color:var(--ink-2)}
.calbtn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}
.calbtn:active{background:rgba(255,255,255,.12)}
.calinput{position:absolute;opacity:0;width:0;height:0;pointer-events:none}
.todaychip{border:0;cursor:pointer;font-family:var(--ff);font-size:12.5px;font-weight:590;
  color:#0A0F22;background:var(--ink);border-radius:99px;padding:8px 13px;
  animation:popin .34s var(--ease)}
.todaychip:active{opacity:.8}
@keyframes popin{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
.nowdot{position:absolute;left:50%;bottom:5px;width:3.5px;height:3.5px;margin-left:-1.75px;
  border-radius:50%;background:var(--brass)}
.dchip{position:relative}

/* week strip */
.dchip{position:relative;width:50px;padding:8px 5px 9px;display:flex;
  flex-direction:column;align-items:center;gap:3px}
.dchip .mn{display:block;margin-top:1px}
.dchip b{margin-top:0}

/* month calendar, Apple Fitness layout with lunar phases in the cells */
body.noscroll{overflow:hidden}
.calsheet{
  position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;
  background:rgba(7,12,30,.86);
  -webkit-backdrop-filter:saturate(180%) blur(30px);backdrop-filter:saturate(180%) blur(30px);
  transform:translateY(100%);pointer-events:none;
  transition:transform .46s cubic-bezier(.3,1,.4,1)}
.calsheet.open{transform:translateY(0);pointer-events:auto}
.calhead{display:flex;align-items:center;justify-content:center;position:relative;
  padding:max(16px,env(safe-area-inset-top)) 20px 12px;flex:0 0 auto}
.calhead span{font-size:19px;font-weight:640;letter-spacing:-.02em}
.calclose{position:absolute;right:18px;top:max(12px,env(safe-area-inset-top));
  width:34px;height:34px;border-radius:50%;cursor:pointer;display:grid;place-items:center;
  background:rgba(255,255,255,.09);border:0;color:var(--ink);font-size:19px;line-height:1}
.calclose:active{background:rgba(255,255,255,.18)}
.calweek{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;
  padding:2px 14px 8px;flex:0 0 auto;
  border-bottom:.5px solid rgba(110,135,195,.16)}
.calweek span{text-align:center;font-size:11px;font-weight:560;color:var(--ink-3)}
.calscroll{flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;
  padding:4px 14px calc(var(--tabh) + 30px);-webkit-overflow-scrolling:touch}
.calscroll::-webkit-scrollbar{display:none}
.cmonth{padding-top:16px}
.cmname{margin:0 0 8px;font-size:22px;font-weight:680;letter-spacing:-.025em;color:var(--ink)}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px 2px}
.cday{border:0;background:none;padding:5px 0 3px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  font-family:var(--ff);border-radius:12px;transition:background .2s var(--ease)}
.cday.empty{pointer-events:none}
.cday:active{background:rgba(255,255,255,.07)}
.cnum{font-size:14px;color:var(--ink-2);line-height:1.5;
  width:24px;height:24px;display:grid;place-items:center;border-radius:50%;
  font-variant-numeric:tabular-nums}
.cday.today .cnum{background:var(--brass);color:#0A0F22;font-weight:680}
.cday.sel{background:rgba(150,180,245,.13)}
.cday.sel .cnum{color:var(--ink);font-weight:640}
.cday .mn{opacity:.95}
.cday.empty .mn{display:none}
.datestrip{display:flex;gap:7px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.datestrip::-webkit-scrollbar{display:none}
.dchip{
  flex:0 0 auto;border:0;cursor:pointer;font-family:var(--ff);
  background:rgba(255,255,255,.045);color:var(--ink-3);
  border-radius:13px;padding:8px 6px;width:46px;text-align:center;
  transition:background .3s var(--ease), color .3s var(--ease), transform .3s var(--ease);
}
.dchip b{display:block;font-size:15px;font-weight:620;color:var(--ink-2);margin-top:2px}
.dchip small{font-size:9.5px;letter-spacing:.07em;text-transform:uppercase}
.dchip.on{background:rgba(150,180,245,.17);color:var(--ink);transform:translateY(-2px)}
.dchip.on b{color:var(--ink)}

.moonrow{display:flex;align-items:center;gap:16px}
.moondisc{
  flex:0 0 auto;width:74px;height:74px;border-radius:50%;position:relative;
  background:#0C1striped;overflow:hidden;
  background:radial-gradient(circle at 36% 34%, #E8EDF7, #9FAEC6 62%, #5E6C8A 100%);
  box-shadow:0 0 26px -6px rgba(190,210,245,.5);
}
.moondisc .shadow{
  position:absolute;inset:0;border-radius:50%;
  background:#070C1E;
  transition:transform .8s var(--ease);
}
.moondisc .craters{position:absolute;inset:0;border-radius:50%;opacity:.5;
  background:radial-gradient(circle at 40% 42%,rgba(60,72,96,.6) 0 9%,transparent 11%),
             radial-gradient(circle at 63% 61%,rgba(60,72,96,.5) 0 6%,transparent 8%),
             radial-gradient(circle at 30% 68%,rgba(60,72,96,.45) 0 5%,transparent 7%)}

.cats{display:flex;flex-direction:column;gap:10px}
.cat{
  width:100%;text-align:left;border:0;cursor:pointer;font-family:var(--ff);
  background:linear-gradient(168deg, rgba(30,44,88,.42), rgba(14,22,50,.34));
  border:.5px solid rgba(110,135,195,.18);
  border-radius:15px;padding:15px 16px;color:var(--ink);
  display:grid;grid-template-columns:30px 1fr auto;gap:13px;align-items:start;
  transition:background .3s var(--ease), transform .2s var(--ease);
}
.cat:active{transform:scale(.988)}
.cat .dot{width:26px;height:26px;border-radius:50%;margin-top:1px;
  box-shadow:0 0 14px -3px currentColor}
.cat h3{margin:0 0 3px;font-size:15px;font-weight:620;letter-spacing:-.01em}
.cat p{margin:0;font-size:13px;line-height:1.48;color:var(--ink-2)}
.cat .why{
  font-family:var(--fm);font-size:9px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3);margin-top:7px;display:block}

.tline{display:flex;gap:12px;padding:12px 0;border-top:.5px solid var(--line)}
.tline:last-child{border-bottom:.5px solid var(--line)}
.tline .when{font-family:var(--fm);font-size:10.5px;color:var(--ink-3);
  flex:0 0 74px;padding-top:2px;font-variant-numeric:tabular-nums}
.tline .what{flex:1}
.tline .what b{font-weight:600;font-size:14px}
.tline .what p{margin:3px 0 0;font-size:12.5px;color:var(--ink-2);line-height:1.45}
.pill{display:inline-block;font-family:var(--fm);font-size:9px;letter-spacing:.08em;
  text-transform:uppercase;padding:2px 7px;border-radius:99px;
  border:.5px solid var(--line-2);color:var(--ink-3);margin-left:6px}

/* -- universe ---------------------------------------------------- */
.stagewrap{display:grid;place-items:center;padding:6px 0 4px;
  transition:transform .68s var(--ease)}
.zoomed .stagewrap{transform:translateY(-8dvh)}
.stage{position:relative;width:min(92vw,430px);aspect-ratio:1}
.orbit{position:absolute;inset:0;transform-origin:50% 50%;
  transition:transform .72s var(--ease),filter .5s var(--ease),opacity .5s var(--ease)}
.stage.pmode .orbit{transform:scale(.94);filter:blur(2.4px) saturate(.55);opacity:.42}
svg.chart,svg.asp{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
svg.asp{pointer-events:none}
.hs{fill:rgba(255,255,255,.014);cursor:pointer;outline:none;
  transition:fill .42s var(--ease),opacity .5s var(--ease)}
.hs:hover{fill:rgba(255,255,255,.05)}
.hs:focus-visible{fill:rgba(160,190,255,.12);stroke:var(--hot);stroke-width:1.4}
.hs.sel{fill:rgba(150,180,240,.09)}
.hs.lit{fill:rgba(194,155,78,.11)}
.hs.dim{opacity:.13}
.fr{fill:none;stroke:var(--line-2);stroke-width:1.1;vector-effect:non-scaling-stroke}
.fr.in{stroke:var(--line);stroke-width:.9}
.sn{font-family:var(--fm);font-size:3.6px;fill:var(--ink-3);text-anchor:middle;
  dominant-baseline:middle;pointer-events:none;opacity:.75;
  transition:opacity .45s var(--ease),fill .45s var(--ease)}
.sn.dim{opacity:.08} .sn.sel{fill:var(--ink-2);opacity:1}
.lg{fill:none;stroke:var(--brass);stroke-width:1.4;vector-effect:non-scaling-stroke;opacity:.5}
.asclbl{font-family:var(--fm);font-size:3px;fill:var(--brass);letter-spacing:.35px;
  text-anchor:middle;dominant-baseline:middle;pointer-events:none;opacity:.85}
.al{fill:none;stroke-width:1;vector-effect:non-scaling-stroke;stroke-linecap:round;opacity:0}
.al.on{opacity:.85;animation:draw .78s var(--ease) forwards}
@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}

.plane{position:absolute;inset:0;pointer-events:none}
.p{position:absolute;width:var(--d);height:var(--d);
  margin-left:calc(var(--d)/-2);margin-top:calc(var(--d)/-2);
  left:calc(var(--x)*100%);top:calc(var(--y)*100%);
  border:0;padding:0;background:none;pointer-events:auto;cursor:pointer;
  border-radius:50%;outline:none;perspective:240px;
  transition:transform .72s var(--ease),opacity .5s var(--ease),filter .5s var(--ease)}
.p .body{position:absolute;inset:0;border-radius:50%;background:var(--fill);
  box-shadow:var(--glow);overflow:hidden}
.p .surf{position:absolute;inset:0;border-radius:50%;background-size:200% 100%;opacity:.55}
.p:not(.shadow) .body::after{content:"";position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.52),rgba(255,255,255,0) 44%),
             radial-gradient(circle at 50% 50%,rgba(0,0,0,0) 52%,rgba(0,0,0,.42) 88%),
             radial-gradient(circle at 74% 78%,rgba(0,0,0,.5),rgba(0,0,0,0) 55%)}
.p[data-g="Jupiter"] .surf,.p[data-g="Saturn"] .surf{
  background-image:repeating-linear-gradient(177deg,rgba(255,255,255,.26) 0 9%,
    rgba(120,80,20,.2) 9% 15%,rgba(255,255,255,.1) 15% 22%,rgba(90,60,20,.16) 22% 30%)}
.p[data-g="Mars"] .surf{background-image:
  radial-gradient(ellipse at 34% 62%,rgba(80,20,10,.55) 0 20%,transparent 23%),
  radial-gradient(ellipse at 68% 33%,rgba(255,190,150,.3) 0 13%,transparent 16%)}
.p[data-g="Moon"] .surf{opacity:.7;background-image:
  radial-gradient(circle at 38% 42%,rgba(40,50,70,.55) 0 10%,transparent 12%),
  radial-gradient(circle at 62% 60%,rgba(40,50,70,.45) 0 7%,transparent 9%),
  radial-gradient(circle at 30% 68%,rgba(40,50,70,.4) 0 5%,transparent 7%)}
.p[data-g="Sun"] .body{box-shadow:0 0 20px -1px var(--sun),0 0 54px -10px var(--sun)}
.p[data-g="Sun"] .body::after{background:radial-gradient(circle at 50% 50%,
  rgba(255,246,214,.75) 0 22%,rgba(255,200,90,.25) 48%,transparent 72%)}
.p .corona{position:absolute;inset:-38%;border-radius:50%;pointer-events:none;
  background:repeating-conic-gradient(from 0deg,rgba(255,196,92,.3) 0deg 3deg,rgba(255,196,92,0) 3deg 11deg),
    radial-gradient(circle,rgba(255,206,120,.34) 24%,rgba(255,180,70,0) 62%);
  -webkit-mask:radial-gradient(circle,transparent 34%,#000 42%,#000 74%,transparent 88%);
          mask:radial-gradient(circle,transparent 34%,#000 42%,#000 74%,transparent 88%)}
.p .ring{position:absolute;left:-52%;top:-52%;width:204%;height:204%;border-radius:50%;
  pointer-events:none;transform:rotateX(74deg) rotate(-17deg);
  border:2px solid rgba(236,220,176,.42);
  box-shadow:inset 0 0 0 1.5px rgba(10,14,28,.9),inset 0 0 0 4px rgba(226,206,158,.3),
             0 0 6px -1px rgba(226,206,158,.35)}
.p.shadow .body{background:#070A11;box-shadow:inset 0 0 8px rgba(0,0,0,.9)}
.p.shadow .halo{position:absolute;inset:-16%;border-radius:50%;pointer-events:none;
  border:1.6px solid var(--fill);opacity:.9;
  box-shadow:0 0 12px -1px var(--fill),inset 0 0 8px -2px var(--fill)}
.p[data-g="Ketu"] .halo{border-style:dashed;border-width:1.8px}
.p .tag{position:absolute;left:50%;top:calc(100% + 4px);transform:translateX(-50%);
  font-family:var(--fm);font-size:8.5px;letter-spacing:.07em;color:var(--ink-3);
  white-space:nowrap;transition:opacity .4s var(--ease)}
.p .retro{position:absolute;right:-3px;top:-3px;font-family:var(--fm);font-size:8px;
  color:var(--ink-2);background:var(--void-2);border:1px solid var(--line-2);
  border-radius:99px;padding:0 3px;line-height:11px}
.p .name{position:absolute;left:50%;bottom:calc(100% + 14%);
  transform:translate(-50%,10px);font-size:11px;font-weight:660;color:var(--ink);
  white-space:nowrap;opacity:0;pointer-events:none;text-shadow:0 2px 18px rgba(0,0,0,.9);
  transition:opacity .5s var(--ease) .18s,transform .6s var(--ease) .18s}
.p .name small{display:block;font-size:6.2px;font-weight:500;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-3);margin-top:2px}
.p.focus .name{opacity:1;transform:translate(-50%,0)}
.p.focus .tag{opacity:0}
.p.dim{opacity:.16;filter:saturate(.4)} .p.hidden{opacity:0;pointer-events:none}
.p.focus{z-index:40}
.p.focus[data-g="Jupiter"] .surf,.p.focus[data-g="Saturn"] .surf{animation:drift 30s linear infinite}
.p.focus[data-g="Mars"] .surf,.p.focus[data-g="Moon"] .surf{animation:turn 46s linear infinite}
.p.focus[data-g="Sun"] .corona{animation:turn 120s linear infinite}
.p.focus.retro .surf{animation-direction:reverse!important}
.p.focus .ring{animation:tilt 18s ease-in-out infinite alternate}
.p.focus .halo{animation:corona 5s ease-in-out infinite}
@keyframes drift{to{background-position-x:-200%}}
@keyframes turn{to{transform:rotate(360deg)}}
@keyframes tilt{to{transform:rotateX(66deg) rotate(-11deg)}}
@keyframes corona{50%{opacity:.55;inset:-20%}}

.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:55;
  padding:20px 20px calc(var(--tabh) + 22px);
  background:linear-gradient(180deg,rgba(7,12,30,0) 0%,rgba(7,12,30,.94) 14%,#070C1E 30%);
  transform:translateY(101%);transition:transform .68s var(--ease);
  max-height:62dvh;overflow-y:auto;overscroll-behavior:contain}
.sheet.up{transform:translateY(0)}
.loc{width:26px;height:26px;vertical-align:-8px;margin-right:9px;overflow:visible}
.lordline{font-size:13.5px;line-height:1.45;color:var(--ink-2);margin:0 0 15px;
  padding:9px 12px;background:rgba(120,150,220,.07);border-left:2px solid var(--hot);
  border-radius:0 7px 7px 0}
.lordline b{color:var(--ink);font-weight:600}
.rows{display:flex;flex-direction:column;margin-bottom:14px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:16px;
  padding:9px 0;border-top:.5px solid var(--line)}
.row:last-child{border-bottom:.5px solid var(--line)}
.k{font-size:12.5px;color:var(--ink-3)}
.v{font-family:var(--fm);font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums}
.sw{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px}
.closebtn{position:fixed;top:max(12px,env(safe-area-inset-top));right:18px;z-index:56;
  width:34px;height:34px;border-radius:50%;background:rgba(24,34,62,.85);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border:.5px solid var(--line-2);color:var(--ink-2);font-size:15px;cursor:pointer;
  display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .4s var(--ease)}
.closebtn.on{opacity:1;pointer-events:auto}

/* -- guide ------------------------------------------------------- */
.chat{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.bubble{max-width:84%;padding:12px 15px;border-radius:19px;font-size:14.5px;line-height:1.5}
.bubble.me{align-self:flex-end;background:rgba(120,150,225,.24);border-bottom-right-radius:6px}
.bubble.it{align-self:flex-start;background:rgba(255,255,255,.055);
  border:.5px solid rgba(110,135,195,.16);border-bottom-left-radius:6px;color:var(--ink-2)}
.bubble.it b{color:var(--ink);font-weight:600}
.cmd{display:flex;align-items:center;gap:8px;margin-top:9px;padding-top:9px;
  border-top:.5px solid var(--line);font-family:var(--fm);font-size:10px;
  letter-spacing:.06em;color:var(--hot)}
.asks{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.ask{border:.5px solid var(--line-2);background:rgba(255,255,255,.03);
  color:var(--ink-2);border-radius:99px;padding:9px 14px;font-size:13px;
  font-family:var(--ff);cursor:pointer;transition:background .25s var(--ease)}
.ask:active{background:rgba(255,255,255,.08)}

  const T=(JD-2451545)/36525;

         +(0.019993-0.000101*T)*sind(2*M)+0.000289*sind(3*M);
  return norm(L0+C);
}

  const f=e/360;
  const names=["New Moon","Waxing Crescent","First Quarter","Waxing Gibbous",
               "Full Moon","Waning Gibbous","Last Quarter","Waning Crescent"];
  return {f, illum:(1-Math.cos(e*RAD))/2, name:names[Math.round(f*8)%8],
          waxing:f<0.5, elongation:e};
}

function moonTropical(JD){
  const T=(JD-2451545)/36525;
  const Lp=218.3164477+481267.88123421*T-0.0015786*T*T;
  const D =297.8501921+445267.1114034*T-0.0018819*T*T;
  const M =357.5291092+35999.0502909*T;
  const Mp=134.9633964+477198.8675055*T+0.0087414*T*T;
  const F =93.2720950+483202.0175233*T-0.0036539*T*T;
  const l=Lp+6.288774*sind(Mp)+1.274027*sind(2*D-Mp)+0.658314*sind(2*D)
    +0.213618*sind(2*Mp)-0.185116*sind(M)-0.114332*sind(2*F)
    +0.058793*sind(2*D-2*Mp)+0.057066*sind(2*D-M-Mp)+0.053322*sind(2*D+Mp)
    +0.045758*sind(2*D-M)-0.040923*sind(M-Mp)-0.034720*sind(D)
    -0.030383*sind(M+Mp)+0.015327*sind(2*D-2*F)-0.012528*sind(Mp+2*F)
    +0.010980*sind(Mp-2*F);
  return norm(l);
}
const ayanamsa=JD=>23.85+0.0139721*((JD-2451545)/36525*100);
const moonSidereal=date=>norm(moonTropical(julian(date))-ayanamsa(julian(date)));

/* =============================================================== *
 * ASHTAKOOTA (Gun Milan) - 36 points across eight kootas.
 * Nakshatra indices below are 0-based to match NAK[].
 * =============================================================== */
const GANA=(()=>{const g=Array(27);
  [0,4,6,7,12,14,16,21,26].forEach(i=>g[i]="Deva");
  [1,3,5,10,11,19,20,24,25].forEach(i=>g[i]="Manushya");
  [2,8,9,13,15,17,18,22,23].forEach(i=>g[i]="Rakshasa");
  return g})();
const NADI=(()=>{const n=Array(27);
  [0,5,6,11,12,17,18,23,24].forEach(i=>n[i]="Aadi");
  [1,4,7,10,13,16,19,22,25].forEach(i=>n[i]="Madhya");
  [2,3,8,9,14,15,20,21,26].forEach(i=>n[i]="Antya");
  return n})();
const YONI=["Horse","Elephant","Sheep","Serpent","Serpent","Dog","Cat","Sheep","Cat",
  "Rat","Rat","Cow","Buffalo","Tiger","Buffalo","Tiger","Deer","Deer","Dog","Monkey",
  "Mongoose","Monkey","Lion","Horse","Lion","Cow","Elephant"];
const YONI_ENEMIES=[["Horse","Buffalo"],["Elephant","Lion"],["Sheep","Monkey"],
  ["Serpent","Mongoose"],["Dog","Deer"],["Cat","Rat"],["Cow","Tiger"]];
const VARNA_BY_SIGN={4:"Brahmin",8:"Brahmin",12:"Brahmin",1:"Kshatriya",5:"Kshatriya",
  9:"Kshatriya",2:"Vaishya",6:"Vaishya",10:"Vaishya",3:"Shudra",7:"Shudra",11:"Shudra"};
const VARNA_RANK={Brahmin:4,Kshatriya:3,Vaishya:2,Shudra:1};
const VASHYA_BY_SIGN={1:"Chatushpada",2:"Chatushpada",3:"Manava",4:"Jalachara",
  5:"Vanachara",6:"Manava",7:"Manava",8:"Keeta",9:"Chatushpada",10:"Chatushpada",
  11:"Manava",12:"Jalachara"};
const FRIENDS={Sun:["Moon","Mars","Jupiter"],Moon:["Sun","Mercury"],
  Mars:["Sun","Moon","Jupiter"],Mercury:["Sun","Venus"],Jupiter:["Sun","Moon","Mars"],
  Venus:["Mercury","Saturn"],Saturn:["Mercury","Venus"]};
const ENEMIES={Sun:["Venus","Saturn"],Moon:[],Mars:["Mercury"],Mercury:["Moon"],
  Jupiter:["Mercury","Venus"],Venus:["Sun","Moon"],Saturn:["Sun","Moon","Mars"]};
const relation=(a,b)=>a===b?"friend":(FRIENDS[a]||[]).includes(b)?"friend"
  :(ENEMIES[a]||[]).includes(b)?"enemy":"neutral";

function ashtakoota(boy,girl){
  const bs=signOf(boy.moonL), gs=signOf(girl.moonL);
  const bn=nakOf(boy.moonL),  gn=nakOf(girl.moonL);
  const out=[];

  const bv=VARNA_BY_SIGN[bs],gv=VARNA_BY_SIGN[gs];
  out.push({name:"Varna",max:1,got:VARNA_RANK[bv]>=VARNA_RANK[gv]?1:0,
    a:bv,b:gv,about:"Spiritual compatibility and the balance of ego."});

  const bw=VASHYA_BY_SIGN[bs],gw=VASHYA_BY_SIGN[gs];
  out.push({name:"Vashya",max:2,
    got:bw===gw?2:((bw==="Vanachara")!==(gw==="Vanachara")&&(bw==="Chatushpada"||gw==="Chatushpada")?0:1),
    a:bw,b:gw,about:"Mutual influence - who yields to whom.",simplified:true});

  const tara=(f,t)=>{const c=((t-f)%27+27)%27+1; const r=c%9; return !(r===3||r===5||r===7)};
  const t1=tara(bn,gn),t2=tara(gn,bn);
  out.push({name:"Tara",max:3,got:t1&&t2?3:(t1||t2?1.5:0),
    a:NAK[bn],b:NAK[gn],about:"Birth-star harmony, traditionally linked to health and fortune."});

  const by=YONI[bn],gy=YONI[gn];
  const sworn=YONI_ENEMIES.some(([x,y])=>(by===x&&gy===y)||(by===y&&gy===x));
  out.push({name:"Yoni",max:4,got:by===gy?4:(sworn?0:2),a:by,b:gy,
    about:"Physical and instinctive compatibility.",simplified:true});

  const bl=SIGN_LORD[bs],gl=SIGN_LORD[gs];
  const r1=relation(bl,gl),r2=relation(gl,bl);
  const gm=(r1==="friend"&&r2==="friend")?5:(r1==="enemy"&&r2==="enemy")?0
    :(r1==="neutral"&&r2==="neutral")?3:(r1==="enemy"||r2==="enemy")?1:4;
  out.push({name:"Graha Maitri",max:5,got:gm,a:bl,b:gl,
    about:"Mental and intellectual rapport, judged through the Moon-sign lords."});

  const bg=GANA[bn],gg=GANA[gn];
  const GT={Deva:{Deva:6,Manushya:6,Rakshasa:0},Manushya:{Deva:5,Manushya:6,Rakshasa:0},
            Rakshasa:{Deva:1,Manushya:0,Rakshasa:6}};
  out.push({name:"Gana",max:6,got:GT[bg][gg],a:bg,b:gg,
    about:"Temperament. Deva, Manushya and Rakshasa describe disposition, not worth."});

  const d1=((gs-bs)%12+12)%12+1, d2=((bs-gs)%12+12)%12+1;
  const bad=[[2,12],[5,9],[6,8]].some(([x,y])=>(d1===x&&d2===y)||(d1===y&&d2===x));
  out.push({name:"Bhakoot",max:7,got:bad?0:7,a:SIGNS[bs-1],b:SIGNS[gs-1],
    about:"Family and material harmony, from the distance between Moon signs."});

  const bnd=NADI[bn],gnd=NADI[gn];
  out.push({name:"Nadi",max:8,got:bnd===gnd?0:8,a:bnd,b:gnd,
    about:"Constitutional compatibility. The heaviest koota, and the one most argued over."});

  const total=out.reduce((a,k)=>a+k.got,0);
  return {kootas:out,total,max:36};
}

/* &#9552;&#9552;&#9552; GEOMETRY &#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552; */
const PT={tl:[0,0],tr:[100,0],br:[100,100],bl:[0,100],t:[50,0],r:[100,50],
  b:[50,100],l:[0,50],c:[50,50],q1:[25,25],q2:[75,25],q3:[75,75],q4:[25,75]};
const HOUSES={1:[PT.t,PT.q2,PT.c,PT.q1],2:[PT.tl,PT.t,PT.q1],3:[PT.tl,PT.q1,PT.l],
  4:[PT.l,PT.q1,PT.c,PT.q4],5:[PT.bl,PT.l,PT.q4],6:[PT.bl,PT.q4,PT.b],
  7:[PT.b,PT.q4,PT.c,PT.q3],8:[PT.br,PT.b,PT.q3],9:[PT.br,PT.q3,PT.r],
  10:[PT.r,PT.q3,PT.c,PT.q2],11:[PT.tr,PT.r,PT.q2],12:[PT.tr,PT.q2,PT.t]};
const cent=p=>[p.reduce((a,q)=>a+q[0],0)/p.length,p.reduce((a,q)=>a+q[1],0)/p.length];
const ANCHOR={},LABEL={};
for(const h in HOUSES){
  const c=cent(HOUSES[h]),tri=HOUSES[h].length===3;
  ANCHOR[h]=tri?[c[0]+(50-c[0])*.14,c[1]+(50-c[1])*.14]:c;
  const outer=HOUSES[h].reduce((b,v)=>Math.hypot(v[0]-50,v[1]-50)>Math.hypot(b[0]-50,b[1]-50)?v:b,HOUSES[h][0]);
  LABEL[h]=[c[0]+(outer[0]-c[0])*.56,c[1]+(outer[1]-c[1])*.56];
}

/* Point-in-polygon, so a graha can never be drawn into a neighbouring
   house. Candidate positions are pulled toward the house anchor until
   they sit inside a shrunk copy of the polygon - shrunk by roughly the
   graha's own radius, so the disc clears the border too. */
function inPoly(pt,poly){
  let inside=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const [xi,yi]=poly[i],[xj,yj]=poly[j];
    if(((yi>pt[1])!==(yj>pt[1])) && (pt[0]<(xj-xi)*(pt[1]-yi)/(yj-yi)+xi)) inside=!inside;
  }
  return inside;
}
const shrinkPoly=(poly,k)=>{const c=cent(poly);
  return poly.map(v=>[v[0]+(c[0]-v[0])*k, v[1]+(c[1]-v[1])*k])};
function fitInside(pt,poly,anchor,margin){
  const sp=shrinkPoly(poly,margin);
  if(inPoly(pt,sp)) return pt;
  for(let t=0.08;t<=1;t+=0.08){
    const q=[pt[0]+(anchor[0]-pt[0])*t, pt[1]+(anchor[1]-pt[1])*t];
    if(inPoly(q,sp)) return q;
  }
  return anchor;
}

function locator(h){
  const shapes=Object.keys(HOUSES).map(k=>
    `<polygon points="${HOUSES[k].map(q=>q.join(",")).join(" ")}" fill="${+k===h?"var(--brass)":"transparent"}" fill-opacity="${+k===h?.9:0}" stroke="var(--line-2)" stroke-width="2.5"/>`).join("");
  return `<svg class="loc" viewBox="-4 -4 108 108" aria-hidden="true"><rect x="0" y="0" width="100" height="100" fill="none" stroke="var(--line-2)" stroke-width="2.5"/>${shapes}</svg>`;
}

/* Readings are assembled from chart facts by template &#8212; never free text.
   Each one can name the placement it came from, which is what makes the
   "why am I seeing this?" answer possible. */
function reading(cat){
  const lord=SIGN_LORD[CHART.signOfHouse(cat.house)];
  const lp=CHART.get(lord);
  const occ=CHART.occupants(cat.house);
  const now=CHART.dasha.at(viewDate);
  const dashaTouch=now&&(now.maha.lord===lord||now.antar.lord===lord);

  let s=`${BHAVA[cat.house-1][1]} is governed here by ${lord}, which sits in your ${ordinal(lp.house)} house`;
  s+=lp.dig?` and is ${lp.dig.toLowerCase()}. `:`. `;
  if(occ.length) s+=`${occ.map(o=>o.graha).join(" and ")} ${occ.length>1?"occupy":"occupies"} the house itself. `;
  else s+=`No graha occupies the house, so it is read through its lord. `;
  if(dashaTouch) s+=`${lord} also rules the period you are currently running, which traditionally brings this area forward.`;
  else s+=`Traditionally read as steady rather than emphasised in the current period.`;
  return {text:s.replace(/ {2,}/g," "), why:`${ordinal(cat.house)} house &#183; lord ${lord} in ${ordinal(lp.house)}${dashaTouch?" &#183; active dasha":""}`};
}

const PEL={};
function renderUniverse(){
  const pg=document.getElementById("pg-universe");
  pg.innerHTML=`
    <div class="eyebrow">Vrishabha lagna &#183; ${fmtDeg(CHART.ascendant)} &#183; Rohini</div>

          <div class="plane" id="plane"></div>
        </div>
      </div>
    </div>`;

  const chart=document.getElementById("chart"), plane=document.getElementById("plane");
  for(let h=1;h<=12;h++){
    const sg=CHART.signOfHouse(h), occ=CHART.occupants(h);
    const s=el("polygon",{points:HOUSES[h].map(p=>p.join(",")).join(" "),
      class:"hs","data-h":h,tabindex:"0",role:"button"});
    s.setAttribute("aria-label",
      `${ordinal(h)} house. ${SIGNS[sg-1]}, sign ${sg}. Ruled by ${SIGN_LORD[sg]}. `+
      (occ.length?`${occ.map(o=>o.graha).join(", ")} ${occ.length>1?"occupy":"occupies"} this house.`:"No graha here."));
    chart.appendChild(s);
    const L=LABEL[h], t=el("text",{class:"sn",x:L[0],y:L[1],"data-h":h});
    t.textContent=String(sg); chart.appendChild(t);
  }
  chart.appendChild(el("rect",{x:0,y:0,width:100,height:100,class:"fr"}));
  chart.appendChild(el("line",{x1:0,y1:0,x2:100,y2:100,class:"fr in"}));
  chart.appendChild(el("line",{x1:100,y1:0,x2:0,y2:100,class:"fr in"}));
  chart.appendChild(el("polygon",{points:"50,0 100,50 50,100 0,50",class:"fr in"}));
  chart.appendChild(el("polygon",{points:HOUSES[1].map(p=>p.join(",")).join(" "),class:"lg"}));
  const asc=el("text",{class:"asclbl",x:50,y:9}); asc.textContent="ASC"; chart.appendChild(asc);

  for(const p of CHART.placements){
    const sibs=CHART.occupants(p.house), i=sibs.indexOf(p), n=sibs.length;
    const a=ANCHOR[p.house], poly=HOUSES[p.house], tri=poly.length===3;
    const sz={Sun:1.06,Moon:1.1,Mars:1,Mercury:.94,Jupiter:1.14,Venus:1,Saturn:1.08,Rahu:.92,Ketu:.9}[p.graha];
    const dpx=(n>=3?23:n===2?26:30)*sz;

    /* lay the group out on a short arc centred on the anchor, then clamp
       every member inside the house */
    const step=n===1?0:(tri?7.0:9.5);
    const spread=(i-(n-1)/2)*step;
    const rise=n<=2?0:Math.abs(i-(n-1)/2)*(tri?2.6:3.6);
    const margin=tri?0.46:0.30;
    const fit=fitInside([a[0]+spread, a[1]-2.6+rise], poly, a, margin);
    const x=fit[0]/100, y=fit[1]/100;

    const b=document.createElement("button");
    b.className="p"+(shadow(p.graha)?" shadow":"")+(p.retro?" retro":"");
    b.dataset.g=p.graha;
    b.style.setProperty("--x",x); b.style.setProperty("--y",y);
    b.style.setProperty("--d",dpx+"px");
    b.style.setProperty("--fill",COLOUR(p.graha));
    b.style.setProperty("--glow",shadow(p.graha)?`0 0 12px -1px ${COLOUR(p.graha)}`
      :`0 0 16px -2px ${COLOUR(p.graha)}, 0 0 34px -8px ${COLOUR(p.graha)}`);
    b.setAttribute("aria-label",`${p.graha}. ${SIGNS[p.sign-1]}, ${ordinal(p.house)} house, ${p.degf}.`+
      (p.dig?` ${p.dig}.`:"")+(p.retro?" Retrograde.":""));
    b.innerHTML=(p.graha==="Sun"?`<span class="corona"></span>`:``)+
      `<span class="body"><span class="surf"></span></span>`+
      (p.graha==="Saturn"?`<span class="ring"></span>`:``)+
      (shadow(p.graha)?`<span class="halo"></span>`:``)+
      `<span class="name">${p.graha}<small>${SK[p.graha]}</small></span>`+
      `<span class="tag">${p.graha.slice(0,2).toUpperCase()}</span>`+
      (p.retro?`<span class="retro">R</span>`:``);
    b._pos=[x,y]; plane.appendChild(b); PEL[p.graha]=b;
  }

  chart.onclick=e=>{const t=e.target.closest(".hs"); if(t)openHouse(+t.dataset.h)};
  chart.onkeydown=e=>{const t=e.target.closest(".hs");
    if(t&&(e.key==="Enter"||e.key===" ")){e.preventDefault();openHouse(+t.dataset.h)}};
  plane.onclick=e=>{const b=e.target.closest(".p"); if(b){e.stopPropagation();openPlanet(b.dataset.g)}};
}

let mode=null,current=null;
const sheet=document.getElementById("sheet"), closeBtn=document.getElementById("close");
const qa=s=>Array.from(document.querySelectorAll(s));

function clearMarks(){
  qa(".hs").forEach(e=>e.classList.remove("sel","lit","dim"));
  qa(".sn").forEach(e=>e.classList.remove("sel","dim"));
  qa(".p").forEach(e=>e.classList.remove("dim","hidden","focus"));
  document.getElementById("asp").innerHTML="";
}
function resetChart(){
  mode=null;current=null;clearMarks();
  const st=document.getElementById("stage"),ob=document.getElementById("orbit");
  if(st)st.classList.remove("pmode");
  if(ob){ob.style.transform="";ob.style.transformOrigin="50% 50%"}
  qa(".p").forEach(b=>{b.style.transform="";b.style.zIndex=""});
  sheet.classList.remove("up"); closeBtn.classList.remove("on");
  document.getElementById("pg-universe").classList.remove("zoomed");
}
function showSheet(){
  sheet.classList.add("up"); closeBtn.classList.add("on"); sheet.scrollTop=0;
  document.getElementById("pg-universe").classList.add("zoomed");
}

function openHouse(h){
  if(mode==="house"&&current===h)return;
  mode="house";current=h;clearMarks();buzz(9);
  const a=ANCHOR[h],k=HOUSES[h].length===3?2.5:2.15;
  const ob=document.getElementById("orbit");
  ob.style.transformOrigin=`${a[0]}% ${a[1]}%`;
  ob.style.transform=`translate(${50-a[0]}%, ${30-a[1]}%) scale(${k})`;
  qa(".hs").forEach(e=>e.classList.add(+e.dataset.h===h?"sel":"dim"));
  qa(".sn").forEach(e=>e.classList.add(+e.dataset.h===h?"sel":"dim"));
  CHART.placements.forEach(p=>{if(p.house!==h)PEL[p.graha].classList.add("dim")});
  sheetHouse(h); showSheet();
}

function openPlanet(g){
  if(mode==="planet"&&current===g)return;
  const p=CHART.get(g); mode="planet";current=g;clearMarks();buzz(12);
  document.getElementById("stage").classList.add("pmode");
  const b=PEL[g],[px,py]=b._pos,K=.94,T=[.5,.28];
  b.classList.add("focus"); b.style.zIndex=40;
  b.style.transform=`translate(${((T[0]-.5)/K+.5-px)*100}%, ${((T[1]-.5)/K+.5-py)*100}%) scale(${(2.5/K).toFixed(3)})`;
  CHART.placements.forEach(o=>{if(o.graha!==g)PEL[o.graha].classList.add("hidden")});
  qa(".hs").forEach(e=>e.classList.add(+e.dataset.h===p.house?"lit":"dim"));
  qa(".sn").forEach(e=>{if(+e.dataset.h!==p.house)e.classList.add("dim")});
  drawAspects(p); sheetPlanet(p); showSheet();
}

function drawAspects(p){
  const asp=document.getElementById("asp"), from=ANCHOR[p.house];
  CHART.aspectedBy(p.graha).forEach((h,i)=>{
    const to=ANCHOR[h], mx=(from[0]+to[0])/2, my=(from[1]+to[1])/2;
    const path=el("path",{d:`M ${from[0]} ${from[1]} Q ${mx+(mx-50)*.3} ${my+(my-50)*.3} ${to[0]} ${to[1]}`,
      class:"al",stroke:"var(--hot)"});
    asp.appendChild(path);
    const len=path.getTotalLength();
    path.style.setProperty("--len",len);
    path.style.strokeDasharray=len; path.style.strokeDashoffset=len;
    path.style.animationDelay=(.18+i*.12)+"s";
    requestAnimationFrame(()=>path.classList.add("on"));
    const dot=el("circle",{cx:to[0],cy:to[1],r:1.6,fill:"var(--hot)",class:"al",stroke:"none"});
    asp.appendChild(dot); dot.style.animationDelay=(.5+i*.12)+"s";
    requestAnimationFrame(()=>dot.classList.add("on"));
  });
}

function sheetHouse(h){
  const sg=CHART.signOfHouse(h), lord=SIGN_LORD[sg], lp=CHART.get(lord);
  const occ=CHART.occupants(h), inc=CHART.aspecting(h);
  const [sk,head,body]=BHAVA[h-1];
  sheet.innerHTML=`
    <div class="eyebrow">${locator(h)}${ordinal(h)} house &#183; ${sk} Bhava &#183; ${SIGNS_SK[sg-1]} rashi</div>
    <h1 style="font-size:26px">${head}</h1>
    <p class="muted" style="margin:0 0 14px">${body}</p>
    <p class="lordline">Sign <b>${sg}</b> (${SIGNS[sg-1]}) &#183; ruled by <b>${lord}</b>, which sits in the <b>${ordinal(lp.house)}</b></p>
    ${rows([
      ["Sign",`${SIGNS[sg-1]} (${sg})`],
      ["Grahas here",occ.length?occ.map(o=>`<span class="sw" style="background:${COLOUR(o.graha)}"></span>${o.graha}`).join("&nbsp; "):"&#8212;"],
      ["Aspected by",inc.length?inc.join(", "):"&#8212;"],
      ["Classification",[h===1||h===4||h===7||h===10?"Kendra":null,
        [1,5,9].includes(h)?"Trikona":null,[6,8,12].includes(h)?"Dusthana":null,
        [3,6,10,11].includes(h)?"Upachaya":null].filter(Boolean).join(" &#183; ")||"&#8212;"]
    ])}
    <p class="muted" style="font-size:13px">${occ.length
      ? `${occ.map(o=>o.graha).join(" and ")} ${occ.length>1?"sit":"sits"} here in ${SIGNS[sg-1]}${occ[0].dig?`, ${occ[0].dig.toLowerCase()}`:""}. ${CORE[occ[0].graha]}`
      : `No graha occupies this house, which in Vedic practice is not an empty subject &#8212; it is read through its lord, ${lord}, and through whatever drishti reaches it.`}</p>`;
}

function sheetPlanet(p){
  const g=p.graha, ruled=CHART.housesRuled(g), conj=CHART.conjunct(g);
  const now=CHART.dasha.at(new Date());
  sheet.innerHTML=`
    <div class="eyebrow">${SK[g]}${shadow(g)?" &#183; chhaya graha":""}</div>
    <h1 style="font-size:26px">${g}</h1>
    <p class="muted" style="margin:0 0 14px">${CORE[g]}</p>
    <p class="lordline">${ruled.length
      ? `Lord of the <b>${ruled.map(ordinal).join(" & ")}</b>, sitting in the <b>${ordinal(p.house)}</b>`
      : `Owns no sign, so rules no house. Sitting in the <b>${ordinal(p.house)}</b>`}</p>
    ${rows([
      ["Sign",`<span class="sw" style="background:${COLOUR(g)}"></span>${SIGNS[p.sign-1]} (${p.sign})`],
      ["Degree",p.degf],
      ["Nakshatra",`${p.nak} &#183; pada ${p.pada}`],
      ["Motion",p.retro?(shadow(g)?"Retrograde (always)":"Retrograde"):"Direct"],
      ["Dignity",p.dig||"&#8212;"],
      ["Conjunct",conj.length?conj.join(", "):"&#8212;"],
      ["Aspects",CHART.aspectedBy(g).map(ordinal).join(", ")],
      ["Natural karaka",KARAKA[g]]
    ])}
    <p class="muted" style="font-size:13px">${
      now.maha.lord===g?`You are currently running the <b style="color:var(--ink)">${g} mahadasha</b>, so this graha governs the present period.`
      :now.antar.lord===g?`${g} rules your current <b style="color:var(--ink)">antardasha</b> &#8212; the sub-period inside a ${now.maha.lord} mahadasha.`
      :`${g} does not rule the period you are currently running (${now.maha.lord}/${now.antar.lord}).`}</p>
    ${p.retro&&!shadow(g)?`<p class="muted" style="font-size:12.5px;margin-top:10px">
      Retrograde motion is apparent, not real. ${g} does not reverse in space &#8212; Earth
      overtakes it on the inside of its orbit, the way a slower train seems to slide
      backwards as yours passes. Tradition reads it as a matter returned to rather than
      settled first time.</p>`:``}`;
}

const GLOSSARY=[
 ["The frame",[
  ["Lagna","The ascendant - the exact degree of the zodiac rising on the eastern horizon at your birth minute. It fixes house 1, and so fixes everything else."],
  ["Bhava","A house. Twelve divisions of the chart, each covering an area of life. Houses stay put; signs rotate across them."],
  ["Rashi","A zodiac sign. Twelve of them, 30 degrees each, measured against the fixed stars rather than the seasons."],
  ["Graha","A 'grasper'. The nine bodies a chart reads - seven visible, plus Rahu and Ketu, which have no body at all."],
  ["Ayanamsa","The gap between the tropical and sidereal zodiacs, currently about 24 degrees. Vedic astrology subtracts it; Western astrology does not. This is the single biggest difference between the two."]]],
 ["Position",[
  ["Nakshatra","A lunar mansion. Twenty-seven of them, 13 degrees 20 minutes each - a finer grid than the signs, and the one your dasha sequence is built from."],
  ["Pada","A quarter of a nakshatra, 3 degrees 20 minutes wide. 108 padas cover the zodiac."],
  ["Lord","The graha that owns a sign. A house is read through the lord of the sign sitting in it, and through where that lord landed."],
  ["Drishti","Aspect, literally 'gaze'. Every graha looks at the 7th house from itself. Mars also looks at the 4th and 8th, Jupiter the 5th and 9th, Saturn the 3rd and 10th."],
  ["Retrograde","Apparent backward motion. Nothing reverses in space - Earth overtakes the planet on the inside track. Read as a matter returned to rather than settled first time."]]],
 ["Strength",[
  ["Exalted","A graha in the sign where it is traditionally strongest. Saturn in Libra, Jupiter in Cancer, Mars in Capricorn."],
  ["Debilitated","The opposite sign to exaltation, where it is traditionally weakest. Not a verdict - a debilitated graha can still be well placed."],
  ["Own sign","A graha sitting in a sign it rules. Comfortable, and reliably itself."],
  ["Moolatrikona","A specific degree range within a graha's own sign where it is at root strength."],
  ["Kendra","Houses 1, 4, 7 and 10 - the angles. Traditionally the strongest positions."],
  ["Trikona","Houses 1, 5 and 9 - the trines. Traditionally the most fortunate."],
  ["Dusthana","Houses 6, 8 and 12 - the difficult ones. Debt, upheaval and loss."],
  ["Shadbala","Six-fold strength. A numeric score for each graha across position, time, direction, motion, nature and aspect."],
  ["Ashtakavarga","A bindu, or point, system giving each house a score. More points, more traditional support."]]],
 ["Time",[
  ["Dasha","A planetary period. The main timing system, dividing life into stretches each governed by one graha."],
  ["Mahadasha","A major period. The nine run 120 years in total; yours began with Ketu because your Moon sits in Mula."],
  ["Antardasha","A sub-period inside a mahadasha, following the same order and proportions."],
  ["Vimshottari","The 120-year dasha system, the most widely used. Its starting point comes entirely from the Moon's nakshatra at birth."],
  ["Gochara","Transit. Where the grahas are right now, as against where they were at your birth."],
  ["Sade Sati","The roughly seven-and-a-half years Saturn spends transiting the signs before, on and after your natal Moon."]]],
 ["People",[
  ["Karaka","A natural significator. Jupiter signifies children wherever it sits; Venus signifies the spouse."],
  ["Atmakaraka","The graha at the highest degree in the chart. Read as the soul's chief indicator."],
  ["Darakaraka","The graha at the lowest degree. Traditionally read for the spouse."],
  ["Gun Milan","Ashtakoota matching. Eight tests worth 36 points between two charts, weighted toward Nadi and Bhakoot."],
  ["Gana","Temperament by nakshatra - Deva, Manushya or Rakshasa. A classification, not a judgement."],
  ["Nadi","Constitution by nakshatra - Aadi, Madhya or Antya. The heaviest koota in matching, and the most argued over."],
  ["Manglik","A chart with Mars in the 1st, 2nd, 4th, 7th, 8th or 12th. Traditionally flagged in matching; treated with far more weight in some regions than others."]]],
 ["Combinations",[
  ["Yoga","A named combination of placements. Hundreds exist; most charts carry several."],
  ["Dosha","An affliction or flaw in a chart. Traditionally something to be aware of, not a sentence."],
  ["Kalsarpa","All seven grahas caught between Rahu and Ketu."],
  ["Combust","A graha too close to the Sun to be seen, and traditionally weakened by it."],
  ["Conjunction","Two grahas sharing a sign, blending their significations."],
  ["Divisional chart","A subdivision of the chart used for one area of life - D9 for marriage, D10 for career, D7 for children."]]]
];

/* Draw a real lunar phase, not an icon.
   The lit region is bounded by two arcs: the outer limb (a semicircle on
   the lit side) and the terminator (a half-ellipse whose x-radius goes to
   zero at the quarters and back to r at new and full). */
function moonPath(r,k,waxing){
  const rx=(r*Math.abs(1-2*k)).toFixed(3);
  /* SVG sweep in a y-down space: from the top point, sweep 1 traces the
     RIGHT limb, sweep 0 the LEFT. The terminator runs bottom-to-top, so its
     flags read the other way round. A crescent needs the terminator hugging
     the SAME side as the lit limb (the two arcs nearly coincide); a gibbous
     needs it bulging across to the far side. */
  const limb=waxing?1:0;
  const term=waxing?(k<0.5?0:1):(k<0.5?1:0);
  return `M 0,${-r} A ${r},${r} 0 0 ${limb} 0,${r} A ${rx},${r} 0 0 ${term} 0,${-r} Z`;
}
function moonSVG(date,size){
  const ph=moonPhase(date), r=size/2-0.5;
  return `<svg class="mn" viewBox="${-size/2} ${-size/2} ${size} ${size}" width="${size}" height="${size}" aria-hidden="true">
    <circle r="${r}" fill="#141C33" stroke="rgba(150,175,225,.28)" stroke-width=".6"/>
    ${ph.illum>0.012?`<path d="${moonPath(r,ph.illum,ph.waxing)}" fill="url(#mnfill)"/>`:``}
  </svg>`;
}
const MOON_DEFS=`<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <radialGradient id="mnfill" cx="34%" cy="30%">
    <stop offset="0%" stop-color="#F2F5FC"/><stop offset="62%" stop-color="#C3CEE4"/>
    <stop offset="100%" stop-color="#8B99B8"/></radialGradient></defs></svg>`;


/* ---- MONTH CALENDAR -------------------------------------------------
   Apple Fitness lays a year out as one continuous scroll of month grids,
   each day carrying a glanceable daily metric. Ours carries the lunar
   phase, which is the closest thing this app has to a daily reading. */
const CAL_BACK=18, CAL_FWD=18;      // months either side of today
function monthGrid(y,m){
  const first=new Date(y,m,1), days=new Date(y,m+1,0).getDate();
  const lead=(first.getDay()+6)%7;              // Monday-first
  const cells=[];
  for(let i=0;i<lead;i++) cells.push(`<div class="cday empty"></div>`);
  for(let d=1;d<=days;d++){
    const dt=new Date(y,m,d,12);
    const today=isToday(dt), sel=dt.toDateString()===viewDate.toDateString();
    cells.push(`<button class="cday${today?" today":""}${sel?" sel":""}"
      data-iso="${isoOf(dt)}" aria-label="${dt.toDateString()}">
      <span class="cnum">${d}</span>${moonSVG(dt,26)}</button>`);
  }
  return `<section class="cmonth" data-label="${first.toLocaleDateString("en-GB",{month:"long",year:"numeric"})}">
    <h3 class="cmname">${first.toLocaleDateString("en-GB",{month:"short"})}${m===0?` ${y}`:""}</h3>
    <div class="cgrid">${cells.join("")}</div></section>`;
}

function openCalendar(){
  const host=document.getElementById("calsheet");
  const now=new Date(), base=new Date(now.getFullYear(),now.getMonth(),1);
  const months=[];
  for(let i=-CAL_BACK;i<=CAL_FWD;i++){
    const d=new Date(base.getFullYear(),base.getMonth()+i,1);
    months.push(monthGrid(d.getFullYear(),d.getMonth()));
  }
  host.innerHTML=`
    <div class="calhead">
      <span id="calttl">${viewDate.toLocaleDateString("en-GB",{month:"long",year:"numeric"})}</span>
      <button class="calclose" id="calclose" aria-label="Close">&#215;</button>
    </div>
    <div class="calweek">${["M","T","W","T","F","S","S"].map(d=>`<span>${d}</span>`).join("")}</div>
    <div class="calscroll" id="calscroll">${months.join("")}</div>`;
  host.classList.add("open");
  document.body.classList.add("noscroll");

  const scroll=document.getElementById("calscroll");
  const target=scroll.children[CAL_BACK + (viewDate.getFullYear()-now.getFullYear())*12
                + (viewDate.getMonth()-now.getMonth())];
  if(target) scroll.scrollTop=target.offsetTop-8;

  const ttl=document.getElementById("calttl");
  scroll.onscroll=()=>{
    for(const sec of scroll.children){
      if(sec.offsetTop+sec.offsetHeight > scroll.scrollTop+16){
        if(ttl.textContent!==sec.dataset.label) ttl.textContent=sec.dataset.label;
        break;
      }
    }
  };
  scroll.onclick=e=>{
    const b=e.target.closest(".cday[data-iso]"); if(!b) return;
    const [y,m,d]=b.dataset.iso.split("-").map(Number);
    viewDate=new Date(y,m-1,d); buzz(10); closeCalendar(); renderToday();
  };
  document.getElementById("calclose").onclick=closeCalendar;
  buzz(6);
}
function closeCalendar(){
  document.getElementById("calsheet").classList.remove("open");
  document.body.classList.remove("noscroll");
}

/* ---- TIMELINE: a short window over proportional bands ----------
   Bands stay proportional because their length is information - Saturn's
   19 years should dwarf the Sun's 6. So instead of shrinking them to fit,
   the column is taller than its viewport and scrolls, holding the selected
   moment in the middle. The rail carries a Today tick and a dot per event. */
let tlT=null;
const TL_H=780;                     // full column height, px
function tlBounds(){
  const m=CHART.dasha.mahas.slice(0,9);
  return {m, t0:m[0].start.getTime(), t1:m[8].end.getTime()};
}
const tlNowT=()=>{const {t0,t1}=tlBounds();
  return Math.min(Math.max((Date.now()-t0)/(t1-t0),0),1)};

function subEventsMarkup(){
  const {t0,t1}=tlBounds();
  return events().map(e=>{
    const t=(new Date(e.d+"T12:00:00").getTime()-t0)/(t1-t0);
    if(t<0||t>1) return "";
    return `<span class="evdot" style="top:${t*100}%;background:${KIND_COLOUR[e.k]||"var(--hot)"}"
             title="${e.t}"></span>`;
  }).join("");
}

function subTimeline(){
  const {m}=tlBounds();
  if(tlT===null) tlT=tlNowT();
  return backBar("Timeline")+`
    <p class="muted" style="font-size:13px;margin:-6px 0 14px">
      120 years of Vimshottari, in the order your Moon in Mula set.</p>
    <div class="tlwrap">
      <div class="tlview">
        <div class="tlcol" id="tlcol" style="height:${TL_H}px">
          ${m.map((d,i)=>`<div class="band" data-i="${i}" style="flex:${d.years};
            background:linear-gradient(90deg, ${COLOUR(d.lord)}26, ${COLOUR(d.lord)}06)">
            <span class="yr">${d.start.getFullYear()}</span>
            <span class="ld" style="color:${COLOUR(d.lord)}">${d.lord}</span>
            <span class="dur">${d.years.toFixed(1)}y</span></div>`).join("")}
        </div>
        <div class="tlfocus"></div>
      </div>
      <div class="vscroll" id="vs" role="slider" tabindex="0"
           aria-label="Move through time" aria-valuemin="0" aria-valuemax="100">
        <div class="vrail"></div>
        <span class="nowtick" id="nowtick"></span>
        ${subEventsMarkup()}
        <div class="vthumb" id="vt"></div>
      </div>
    </div>
    <div class="tlbar">
      <button class="todaychip" id="tlnow">Today</button>
      <span class="muted" style="font-size:11.5px;color:var(--ink-3)">Drag the rail, or tap a period</span>
    </div>
    <div id="ro" class="readout"></div>`;
}

function dashaImpact(lord){
  const p=CHART.get(lord), ruled=CHART.housesRuled(lord);
  const bits=[];
  bits.push(ruled.length
    ? `Rules your ${ruled.map(ordinal).join(" and ")} house${ruled.length>1?"s":""} &#8212; ${ruled.map(h=>BHAVA[h-1][1]).join("; ").toLowerCase()}.`
    : `Owns no sign, so rules no house. A shadow graha acts through whatever it sits with.`);
  bits.push(`Sits in your ${ordinal(p.house)} &#8212; ${BHAVA[p.house-1][1].toLowerCase()} &#8212; in ${SIGNS[p.sign-1]}${p.dig?`, ${p.dig.toLowerCase()}`:""}.`);
  const conj=CHART.conjunct(lord);
  if(conj.length) bits.push(`Shares that sign with ${conj.join(" and ")}.`);
  bits.push(`Casts drishti on the ${CHART.aspectedBy(lord).map(ordinal).join(", ")}.`);
  return bits;
}

function wireTimeline(){
  const {m,t0,t1}=tlBounds();
  const vs=document.getElementById("vs"), vt=document.getElementById("vt");
  const col=document.getElementById("tlcol"), view=col.parentElement;
  let lastLord=null;

  document.getElementById("nowtick").style.top=(tlNowT()*100)+"%";

  const paint=()=>{
    vt.style.top=(tlT*100)+"%";
    vs.setAttribute("aria-valuenow",Math.round(tlT*100));
    const vh=view.clientHeight;
    col.style.transform=`translateY(${-(tlT*TL_H - vh/2)}px)`;

    const when=new Date(t0+tlT*(t1-t0));
    const now=CHART.dasha.at(when); if(!now) return;
    document.querySelectorAll(".band").forEach((b,i)=>
      b.classList.toggle("on", when>=m[i].start && when<m[i].end));

    const prog=(when-now.maha.start)/(now.maha.end-now.maha.start);
    const age=Math.floor((when-CHART.birthDate)/(365.2425*864e5));
    const inPeriod=events().filter(e=>{const d=new Date(e.d+"T12:00:00");
      return d>=now.maha.start && d<now.maha.end});

    document.getElementById("ro").innerHTML=`
      <div class="eyebrow">${fmtDate(when)} &#183; age ${age}${isToday(when)?' &#183; today':''}</div>
      <p class="big" style="color:${COLOUR(now.maha.lord)}">${now.maha.lord} mahadasha</p>
      <p class="muted" style="font-size:13px;margin:0">${now.antar.lord} antardasha &#183;
        ${fmtDate(now.antar.start)} to ${fmtDate(now.antar.end)}</p>
      <div class="bar"><i style="width:${(prog*100).toFixed(1)}%;background:${COLOUR(now.maha.lord)}"></i></div>
      <p class="muted" style="font-size:11.5px;color:var(--ink-3);margin:0">
        ${Math.round(prog*100)}% through ${now.maha.years.toFixed(1)} years &#183; ends ${fmtDate(now.maha.end)}</p>
      ${inPeriod.length?`
        <div class="eyebrow" style="margin:20px 0 8px">Your life in this period</div>
        ${inPeriod.map(e=>{const ed=eventDasha(e.d);
          return `<div class="evrow">
            <span class="evkey" style="background:${KIND_COLOUR[e.k]}"></span>
            <span><b>${e.t}</b>
              <span class="evmeta">${fmtDate(new Date(e.d+"T12:00:00"))} &#183;
              ${ed?`${ed.maha.lord}/${ed.antar.lord}`:""}</span></span></div>`}).join("")}
        <p class="muted" style="font-size:11.5px;color:var(--ink-3);margin:2px 0 0">
          Shown alongside the period that was running, not as its result.</p>`:``}
      <div class="eyebrow" style="margin:20px 0 8px">What this period touches</div>
      ${dashaImpact(now.maha.lord).map(t=>`<p class="impact">${t}</p>`).join("")}
      <div class="eyebrow" style="margin:20px 0 8px">And within it, ${now.antar.lord}</div>
      ${dashaImpact(now.antar.lord).slice(0,2).map(t=>`<p class="impact">${t}</p>`).join("")}
      ${practiceFor(now.maha.lord)}
      <p class="note">Traditional associations for the houses involved &#8212; not a forecast.</p>`;
    if(now.maha.lord!==lastLord){lastLord=now.maha.lord;buzz(11)}
  };

  const setFromY=cy=>{const r=vs.getBoundingClientRect();
    tlT=Math.min(Math.max((cy-r.top)/r.height,0),1); paint()};
  let dragging=false;
  vs.addEventListener("pointerdown",e=>{dragging=true;vs.setPointerCapture(e.pointerId);setFromY(e.clientY)});
  vs.addEventListener("pointermove",e=>{if(dragging)setFromY(e.clientY)});
  vs.addEventListener("pointerup",()=>dragging=false);
  vs.addEventListener("keydown",e=>{const step=e.shiftKey?0.05:0.01;
    if(e.key==="ArrowDown"){tlT=Math.min(tlT+step,1);paint();e.preventDefault()}
    if(e.key==="ArrowUp"){tlT=Math.max(tlT-step,0);paint();e.preventDefault()}});
  document.querySelectorAll(".band").forEach(b=>b.onclick=()=>{
    const d=m[+b.dataset.i];
    tlT=(((d.start.getTime()+d.end.getTime())/2)-t0)/(t1-t0); buzz(8); paint()});
  document.getElementById("tlnow").onclick=()=>{tlT=tlNowT();buzz(10);paint()};
  paint();
}

function wireEvents(){
  document.getElementById("addev").onclick=()=>{
    const t=prompt("What happened?"); if(!t) return;
    const d=prompt("When? (YYYY-MM-DD)"); if(!d||isNaN(new Date(d+"T12:00:00"))) {

    l.splice(+b.dataset.i,1); saveEvents(l); buzz(9); renderSub();
  });

/* ---- LIFE EVENTS -------------------------------------------------
   The user's own history, laid against astrological time. Framing is
   deliberate and fixed by CLAUDE.md 51: an event is shown alongside the
   period that was running, never as something the period caused. */
const LKEY="astro.events.v1";
const EVENT_KINDS={career:"Career",relationship:"Relationship",home:"Home",
  study:"Study",health:"Health",milestone:"Milestone",loss:"Loss"};
const KIND_COLOUR={career:"var(--saturn)",relationship:"var(--venus)",home:"var(--moon)",
  study:"var(--mercury)",health:"var(--mars)",milestone:"var(--jupiter)",loss:"var(--ketu)"};
const DEMO_EVENTS=[
  {d:"2010-08-02",t:"Started university",k:"study",demo:true},
  {d:"2014-07-14",t:"First job",k:"career",demo:true},
  {d:"2018-03-09",t:"Moved city",k:"home",demo:true},
  {d:"2021-11-18",t:"Founded the company",k:"career",demo:true},
  {d:"2025-02-06",t:"Shipped the first product",k:"milestone",demo:true}

    return l.sort((a,b)=>a.d<b.d?-1:1);

};
const saveEvents=l=>localStorage.setItem(LKEY,JSON.stringify(l));

function subPartner(){
  const p=partners()[subArg]; if(!p){subView="rel";return subRel()}
  const me={moonL:CHART.get("Moon").L};
  const k=ashtakoota(me,{moonL:p.moonL});
  const pct=k.total/36;
  const verdict=k.total>=28?"Traditionally considered a strong match"
    :k.total>=18?"Above the threshold traditionally considered acceptable"
    :"Below the 18-point threshold traditionally considered acceptable";
  return backBar(p.name+(p.demo?` <span class="pill" style="vertical-align:6px">sample data</span>`:""))+`
    <div class="scorecard">
      <div class="scorenum" style="color:${pct>=.5?"var(--mercury)":"var(--mars)"}">
        ${k.total}<small>/36</small></div>
      <div style="flex:1">
        <div class="bar" style="margin:0 0 7px"><i style="width:${pct*100}%;
          background:${pct>=.5?"var(--mercury)":"var(--mars)"}"></i></div>
        <p class="muted" style="font-size:12.5px;margin:0">${verdict}.</p>
      </div>
    </div>
    ${rows([["Born",new Date(p.born).toLocaleString("en-GB",{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"})],
            ["Their Moon",`${SIGNS[signOf(p.moonL)-1]} ${fmtDeg(p.moonL)}`],
            ["Nakshatra",`${NAK[nakOf(p.moonL)]} &#183; pada ${padaOf(p.moonL)}`],
            ["Yours",`${SIGNS[CHART.get("Moon").sign-1]} &#183; ${CHART.get("Moon").nak}`],
            ["Manglik (yours)",manglik(CHART)?"Yes":"No"]])}
    <div class="eyebrow" style="margin:22px 0 10px">The eight kootas</div>
    ${k.kootas.map(x=>`
      <div class="koota">
        <div class="ktop">
          <b>${x.name}</b>
          <span class="kscore" style="color:${x.got===0?"var(--mars)":x.got===x.max?"var(--mercury)":"var(--ink-2)"}">
            ${x.got}<span style="color:var(--ink-3)">/${x.max}</span></span>
        </div>
        <div class="kbar"><i style="width:${(x.got/x.max)*100}%;
          background:${x.got===0?"var(--mars)":x.got===x.max?"var(--mercury)":"var(--hot)"}"></i></div>
        <p class="kabout">${x.about}</p>
        <p class="kvals">You: <b>${x.a}</b> &#183; ${p.name}: <b>${x.b}</b>${
          x.simplified?` <span class="pill">simplified rule</span>`:``}</p>
      </div>`).join("")}
    <button class="danger" id="del">Remove ${p.name}</button>
    <p class="note">${p.approx?`No birth time was given, so noon was assumed. The Moon
      moves about 13&#176; a day, so the nakshatra may be wrong by one either way &#8212;
      which changes several kootas. Add the real time for a reliable score.<br><br>`:``}
      Gun Milan is one traditional method among several, and a score is not a verdict on a
      relationship. Kootas marked <i>simplified rule</i> use a reduced version of a longer
      classical table and will be completed later.</p>`;
}

(function(){
  const cv=document.getElementById("sky"),ctx=cv.getContext("2d");
  function paint(){
    const dpr=Math.min(devicePixelRatio||1,2),w=innerWidth,h=innerHeight;
    cv.width=w*dpr;cv.height=h*dpr;cv.style.width=w+"px";cv.style.height=h+"px";
    ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);
    let s=20260819;const rnd=()=>(s=(s*1664525+1013904223)%4294967296)/4294967296;
    const g=ctx.createLinearGradient(0,h*.1,w,h*.85);
    g.addColorStop(0,"rgba(46,70,140,0)");g.addColorStop(.42,"rgba(52,80,158,.30)");
    g.addColorStop(.58,"rgba(42,66,138,.24)");g.addColorStop(1,"rgba(30,46,96,0)");
    ctx.save();ctx.translate(w/2,h/2);ctx.rotate(-.42);ctx.translate(-w/2,-h/2);
    ctx.filter="blur(38px)";ctx.fillStyle=g;ctx.fillRect(-w*.3,h*.24,w*1.6,h*.30);
    ctx.restore();ctx.filter="none";
    for(const L of [{n:250,r:[.15,.5],a:[.05,.2]},{n:95,r:[.5,.95],a:[.16,.42]},{n:28,r:[.9,1.5],a:[.34,.66]}]){
      for(let i=0;i<L.n;i++){

        const col=wm>.88?"255,214,180":wm<.1?"196,214,255":"214,226,246";
        if(r>.9){const hg=ctx.createRadialGradient(x,y,0,x,y,r*4.5);
          hg.addColorStop(0,`rgba(${col},${a*.5})`);hg.addColorStop(1,`rgba(${col},0)`);
          ctx.fillStyle=hg;ctx.beginPath();ctx.arc(x,y,r*4.5,0,6.284);ctx.fill()}
        ctx.beginPath();ctx.arc(x,y,r,0,6.284);ctx.fillStyle=`rgba(${col},${a})`;ctx.fill();
      }
    }
  }
  paint();addEventListener("resize",paint);
})();
